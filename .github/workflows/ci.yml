name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: SDK info
        run: dotnet --info

      - name: Restore
        run: dotnet restore XINSkan.slnx

      - name: Build (warnings are errors)
        run: dotnet build XINSkan.slnx -c Release --no-restore

      - name: Test
        run: dotnet test XINSkan.slnx -c Release --no-build --logger "trx;LogFileName=results.trx" --logger "console;verbosity=detailed" --results-directory TestResults

      - name: Read-only enforcement must reject forbidden calls
        shell: pwsh
        run: |
          $out = dotnet build tests/XINSkan.NegativeBuild/XINSkan.NegativeBuild.csproj -c Release 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0) { Write-Error "The forbidden-call project compiled: the banned-API analyzer is not active."; exit 1 }
          $hits = ([regex]::Matches($out, 'error RS0030') | ForEach-Object { $_.Value }).Count
          Write-Host "RS0030 errors reported: $hits"
          # ForbiddenCalls.cs lines: 8 File.Delete, 10 Directory.Delete, 12 Process.Start, 14 OpenSubKey(writable: true)
          foreach ($line in 8, 10, 12, 14) {
            if ($out -notmatch "ForbiddenCalls\.cs\($line,\d+\): error RS0030") { Write-Error "No RS0030 reported for ForbiddenCalls.cs line $line"; exit 1 }
          }
          exit 0

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: TestResults

  parser-packages:
    # Open item from docs/LIBRARY_REVIEW.md: which versions of the reviewed parsers are actually published.
    name: Published parser versions
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Query nuget.org
        run: |
          for p in MFT Prefetch JumpList Lnk OleCf ExtensionBlocks GuidMapping; do
            echo "== $p"
            dotnet package search "$p" --exact-match --source https://api.nuget.org/v3/index.json --format json \
              | python3 -c "import sys,json; d=json.load(sys.stdin); v=[p['version'] for r in d.get('searchResult',[]) for p in r.get('packages',[])]; print('versions:', ', '.join(v[-5:]) if v else 'not found')"
          done
