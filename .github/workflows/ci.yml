name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: SDK info
        run: dotnet --info

      - name: Restore
        run: dotnet restore XINSkan.slnx

      - name: Build (warnings are errors)
        run: dotnet build XINSkan.slnx -c Release --no-restore

      - name: Reference NTFS samples (MFT library test corpus, reviewed commit)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'mft-samples'
          $base = 'https://raw.githubusercontent.com/EricZimmerman/MFT/3eecafae50ac8935b239cf3ded690b11af5020f4/MFT.Test/TestFiles'
          $expected = @{
            'tdungan/$MFT'     = 'BD96A16EE812F9C7724EF31A87686A71EADA6C80A4E5131A94945E42500A6A2E'
            'xw/$MFT'          = '2811D925D87BE7E90CDC7943432A32B8C22F141C4EEB13CA708E0A67F12CFE08'
            'NIST/DFR-16/$MFT' = '9D42474A778C6C5C817C8B0EC59607DF637EFF24917E6266602D78FBD97B95F6'
            'DFIRArtifactMuseum/J/Win2012R2/StolenSzechuan/$J' = '3927FDB4559997ABEC7D46F83EF9481607808AE79A5DAE574799E2DBB5332D15'
          }
          foreach ($rel in $expected.Keys) {
            $target = Join-Path $dir $rel
            New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null
            Invoke-WebRequest -Uri ("$base/" + $rel.Replace('$', '%24')) -OutFile $target
            $hash = (Get-FileHash $target -Algorithm SHA256).Hash
            if ($hash -ne $expected[$rel]) { Write-Error "$rel has SHA-256 $hash, expected $($expected[$rel])"; exit 1 }
          }
          "XINSKAN_NTFS_SAMPLES=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "XINSKAN_REQUIRE_SAMPLES=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Reference shell and execution samples (Lnk, JumpList, Prefetch, AmcacheParser corpora and Registry hives, reviewed commits)
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'shell-samples'
          foreach ($repo in @(@('Lnk', 'dab1c8ab9c1c18d2cf89a4938ab95794d17d3a44'), @('JumpList', 'c125c8e008e62255afb3bd176e00efa171d5c1b4'), @('Prefetch', '841212266356a9121a1c34ee538cbce2bb2b9cf3'), @('AmcacheParser', '4706a080461d9506edbd6327bc58fc558978606d'))) {
            $dir = Join-Path $root $repo[0]
            git -c core.autocrlf=false init --quiet $dir
            git -c core.autocrlf=false -C $dir fetch --quiet --depth 1 "https://github.com/EricZimmerman/$($repo[0]).git" $repo[1]
            git -c core.autocrlf=false -C $dir checkout --quiet FETCH_HEAD
            if ((git -C $dir rev-parse HEAD) -ne $repo[1]) { Write-Error "$($repo[0]) is not at the reviewed commit"; exit 1 }
          }
          # Registry hives: the repository is 130 MB, so only these files, by raw URL with pinned hashes.
          $hives = @{
            'SAM'      = '8AEA3C9217BFE1ECC39DF535C25A02D5DFB76D0427298898A370A086C10F72AA'
            'DRIVERS'  = 'B171EA9638C71C7B3CC9595E19378D63BB8251917E5D6296BDD92C0C4324EB28'
            'NotAHive' = 'E4A4034DCCBFE49D305824FD10F4E63D1CA9C886009C381AE87D57F2A1527F66'
            'NTUSER1.DAT' = '8E6B4A5C64A17BCC220DF4A01AEED83D5BE91385CD354511F18F493C39401836'
          }
          $hiveDir = Join-Path $root 'RegistryHives'
          New-Item -ItemType Directory -Force -Path $hiveDir | Out-Null
          foreach ($h in $hives.Keys) {
            $target = Join-Path $hiveDir $h
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/EricZimmerman/Registry/d23a4b049de1ac31efbb915946e028a901d22bfb/Registry.Test/Hives/$h" -OutFile $target
            $hash = (Get-FileHash $target -Algorithm SHA256).Hash
            if ($hash -ne $hives[$h]) { Write-Error "$h has SHA-256 $hash, expected $($hives[$h])"; exit 1 }
          }
          "XINSKAN_SHELL_SAMPLES=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "XINSKAN_EXEC_SAMPLES=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Real Minecraft version (Mojang version file, client and libraries; checked against the manifest)
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'mc-samples'
          $mc = Join-Path $root '.minecraft'
          $manifest = Invoke-RestMethod 'https://piston-meta.mojang.com/mc/game/version_manifest_v2.json'
          $entry = $manifest.versions | Where-Object id -eq '1.20.1'
          $dir = Join-Path $mc 'versions\1.20.1'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $json = Join-Path $dir '1.20.1.json'
          Invoke-WebRequest -Uri $entry.url -OutFile $json
          $sha = (Get-FileHash $json -Algorithm SHA1).Hash.ToLowerInvariant()
          if ($sha -ne $entry.sha1) { Write-Error "version file SHA-1 $sha, manifest says $($entry.sha1)"; exit 1 }
          $version = Get-Content $json -Raw | ConvertFrom-Json
          Invoke-WebRequest -Uri $version.downloads.client.url -OutFile (Join-Path $dir '1.20.1.jar')
          $libs = $version.libraries | Where-Object { $_.downloads.artifact -and -not $_.rules } | Select-Object -First 8
          foreach ($l in $libs) {
            $to = Join-Path $mc ('libraries\' + $l.downloads.artifact.path.Replace('/', '\'))
            New-Item -ItemType Directory -Force -Path (Split-Path $to) | Out-Null
            Invoke-WebRequest -Uri $l.downloads.artifact.url -OutFile $to
          }
          "XINSKAN_MC_SAMPLES=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Test
        run: dotnet test XINSkan.slnx -c Release --no-build --logger "trx;LogFileName=results.trx" --logger "console;verbosity=detailed" --results-directory TestResults

      - name: Read-only enforcement must reject forbidden calls
        shell: pwsh
        run: |
          $out = dotnet build tests/XINSkan.NegativeBuild/XINSkan.NegativeBuild.csproj -c Release 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0) { Write-Error "The forbidden-call project compiled: the banned-API analyzer is not active."; exit 1 }
          $hits = ([regex]::Matches($out, 'error RS0030') | ForEach-Object { $_.Value }).Count
          Write-Host "RS0030 errors reported: $hits"
          # ForbiddenCalls.cs lines: 8 File.Delete, 10 Directory.Delete, 12 Process.Start, 14 OpenSubKey(writable: true)
          foreach ($line in 8, 10, 12, 14) {
            if ($out -notmatch "ForbiddenCalls\.cs\($line,\d+\): error RS0030") { Write-Error "No RS0030 reported for ForbiddenCalls.cs line $line"; exit 1 }
          }
          exit 0

      - name: Real run on this runner (CLI)
        # File Hunter over the runner's real profile; results go to the runner's D: drive, not the investigated C:.
        shell: pwsh
        # The first read of a fresh runner disk is slow and varies (180–700 s seen for File Hunter alone).
        timeout-minutes: 35
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'xinskan-out'
          # A known deletion on the live system volume, a few seconds before the check: does the MFT pass see it
          # without any flush (the USN module always should)?
          $probe = Join-Path $env:USERPROFILE 'Downloads\xinskan-probe-deleted.jar'
          New-Item -ItemType Directory -Force -Path (Split-Path $probe) | Out-Null
          Set-Content -Path $probe -Value 'probe'
          Remove-Item $probe
          Start-Sleep -Seconds 10
          dotnet src/XINSkan.Cli/bin/Release/net10.0/xinskan.dll investigate --output $out --operator CI
          $code = $LASTEXITCODE
          Write-Host "investigate exit code: $code"
          if ($code -ge 2) { exit 1 }
          # Second run on the now-warm disk: separates XIN SKAN's own cost from the first read of a fresh VM
          # disk and on-access antivirus scanning. It also shows the first folder is left untouched.
          $first = Get-ChildItem $out -Directory | Select-Object -First 1
          $before = Get-ChildItem $first.FullName -File | Get-FileHash | ForEach-Object Hash
          dotnet src/XINSkan.Cli/bin/Release/net10.0/xinskan.dll investigate --output $out --operator CI-warm
          if ($LASTEXITCODE -ge 2) { exit 1 }
          $after = Get-ChildItem $first.FullName -File | Get-FileHash | ForEach-Object Hash
          if (Compare-Object $before $after) { Write-Error "The second run changed the first investigation folder"; exit 1 }
          foreach ($folder in Get-ChildItem $out -Directory) {
            $text = dotnet src/XINSkan.Cli/bin/Release/net10.0/xinskan.dll verify $folder.FullName | Out-String
            Write-Host $text
            if ($LASTEXITCODE -ne 0) { Write-Error "verify failed"; exit 1 }
            foreach ($m in 'mft', 'usn') {
              $seen = $text -match "удалено \($m\): .*xinskan-probe-deleted\.jar"
              Write-Host "probe deletion seen by ${m}: $seen"
            }
          }
          Get-ChildItem $first.FullName | Format-Table Name, Length, Attributes
          Get-MpComputerStatus | Format-List RealTimeProtectionEnabled, OnAccessProtectionEnabled, AMRunningMode

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: TestResults

  parser-packages:
    # Open item from docs/LIBRARY_REVIEW.md: which versions of the reviewed parsers are actually published.
    name: Published parser versions
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Query nuget.org
        run: |
          for p in MFT Prefetch JumpList Lnk OleCf ExtensionBlocks GuidMapping; do
            echo "== $p"
            dotnet package search "$p" --exact-match --source https://api.nuget.org/v3/index.json --format json \
              | python3 -c "import sys,json; d=json.load(sys.stdin); v=[p['version'] for r in d.get('searchResult',[]) for p in r.get('packages',[])]; print('versions:', ', '.join(v[-5:]) if v else 'not found')"
          done
